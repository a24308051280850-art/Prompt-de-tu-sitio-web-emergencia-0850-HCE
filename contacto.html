<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Centro de Emergencias - Contacto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #333333;
        }
        header {
            background-color: #d9534f;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .logo-contenedor {
            display: inline-block;
            vertical-align: middle;
        }
        .logo-texto {
            font-size: 28px;
            font-weight: bold;
            display: inline-block;
            vertical-align: middle;
            margin-left: 10px;
        }
        nav {
            background-color: #b52b27;
            padding: 12px;
            text-align: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
            font-size: 16px;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .contenido {
            padding: 30px 20px;
            text-align: center;
        }
        form {
            background-color: #f8f8f8;
            border: 1px solid #d9534f;
            padding: 25px;
            max-width: 450px;
            margin: 0 auto;
            text-align: left;
            border-radius: 5px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 12px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 10px 15px;
            margin-top: 20px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background-color: #b52b27;
        }
        footer {
            background-color: #d9534f;
            color: white;
            text-align: center;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-contenedor">
            <svg width="40" height="40" viewBox="0 0 100 100" style="vertical-align: middle;">
                <circle cx="50" cy="50" r="48" fill="white"/>
                <rect x="42" y="20" width="16" height="60" fill="#d9534f"/>
                <rect x="20" y="42" width="60" height="16" fill="#d9534f"/>
            </svg>
        </div>
        <span class="logo-texto">EMERGENCIA</span>
    </header>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="tipos_emergencia.html">Tipos de Emergencia</a>
        <a href="que_hacer.html">Qué Hacer en caso de Emergencia</a>
        <a href="contacto.html">Contacto</a>
    </nav>

    <div class="contenido">
        <h1>Formulario de Reporte de Emergencia</h1>
        <p>Completa este formulario en caso de requerir apoyo directo:</p>

        <form>
            <label for="nombre">Nombre Completo:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>

            <label for="ubicacion">Dirección o Ubicación:</label>
            <input type="text" id="ubicacion" name="ubicacion" placeholder="Calle, número, colonia" required>

            <label for="tipo">Tipo de Emergencia:</label>
            <select id="tipo" name="tipo" required>
                <option value="">Selecciona una opción</option>
                <option value="medica">Emergencia Médica</option>
                <option value="incendio">Incendio / Fuga de Gas</option>
                <option value="seguridad">Seguridad / Robo</option>
                <option value="otro">Otro</option>
            </select>

            <label for="telefono">Número de Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" placeholder="Ej. 5512345678" required>

            <button type="submit">Enviar Reporte</button>
        </form>
    </div>

    <footer>
        HERNANDEZ CUELLAR EMILIANO 5-J 0850
    </footer>

</body>
</html>
